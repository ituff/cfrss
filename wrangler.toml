name = "cfrss"
main = "src/index.ts"
compatibility_date = "2024-12-30"

routes = [
  { pattern = "rss.maowoo.top", custom_domain = true }
]

# ===== 定时任务：每小时整点自动抓取订阅新文章（新文章以未读状态呈现） =====
[triggers]
crons = ["0 * * * *"]

[vars]
# 每次定时任务最多刷新的订阅数（免费版 10ms CPU 限制，超出部分按最旧优先在后续小时轮转）
CRON_MAX_FEEDS = "10"

[assets]
directory = "./public"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "cfrss-db"
database_id = "61cdf440-f09f-4f5c-a52d-25632704913a"
migrations_dir = "migrations"
